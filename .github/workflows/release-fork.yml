name: Runner CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-fork.yml'
      - 'images/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      image_name:
        default: ''
        type: string
      prerelease:
        default: false
        type: boolean
      release_tag_prefix:
        default: v
        type: string
      runner_version:
        default: ''
        type: string
      source_branch:
        default: main
        type: string
    outputs:
      image_digest:
        value: ${{ jobs.publish-image.outputs.digest }}
      package_checksums:
        value: ${{ toJSON(jobs.build.outputs) }}
      release_tag:
        value: ${{ jobs.check.outputs.release_tag }}
      should_release:
        value: ${{ jobs.check.outputs.should_release }}
      source_sha:
        value: ${{ jobs.merge-upstream.outputs.source_sha }}
      version:
        value: ${{ jobs.check.outputs.version }}
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC

permissions:
  contents: read

concurrency:
  group: runner-cd
  cancel-in-progress: false

jobs:
  merge-upstream:
    outputs:
      source_sha: ${{ steps.merge.outputs.source_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch || 'main' }}

      - name: Merge upstream
        id: merge
        env:
          TARGET_BRANCH: ${{ inputs.source_branch || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fork_head=$(git rev-parse HEAD)

          git remote add upstream https://github.com/falcondev-oss/github-actions-runner
          git fetch upstream

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date with upstream."
          else
            if ! git merge --no-commit --no-ff upstream/main; then
              git rev-parse --quiet --verify MERGE_HEAD > /dev/null || exit 1
            fi

            # Import upstream code and history, but keep the fork's complete
            # workflow tree. This also resolves workflow-only merge conflicts.
            git rm -r -f --ignore-unmatch .github/workflows
            git checkout "$fork_head" -- .github/workflows

            if git ls-files -u | grep -q .; then
              git diff --name-only --diff-filter=U
              echo "::error::Content conflicts outside .github/workflows require manual resolution"
              git merge --abort
              exit 1
            fi

            git commit --no-edit
          fi

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          # Export only after the push succeeds. Even a no-op run has one fixed source.
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: merge-upstream
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.check_version.outputs.build_matrix }}
      should_build: ${{ steps.check_version.outputs.should_build }}
      release_tag: ${{ steps.check_version.outputs.release_tag }}
      should_release: ${{ steps.check_version.outputs.should_release }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.merge-upstream.outputs.source_sha }}

      # Query GitHub release ensure version is not used
      - name: Check version
        id: check_version
        env:
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix || 'v' }}
          RUNNER_VERSION: ${{ inputs.runner_version }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let runnerVersion = process.env.RUNNER_VERSION || '';
            if (!runnerVersion) {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: 'actions',
                repo: 'runner'
              });
              runnerVersion = latestRelease.data.tag_name.replace(/^v/, '');
            }
            if (!/^\d+\.\d+\.\d+$/.test(runnerVersion)) {
              throw new Error(`Invalid stable runner version: ${runnerVersion}`);
            }
            console.log(`Latest runner version: ${runnerVersion}`);
            core.setOutput('version', runnerVersion);
            const releaseTag = `${process.env.RELEASE_TAG_PREFIX || 'v'}${runnerVersion}`;
            core.setOutput('release_tag', releaseTag);

            let shouldRelease = false;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: '${{ github.repository_owner }}',
                repo: '${{ github.event.repository.name }}',
                tag: releaseTag
              })
              console.log('Release with same tag already exists: ' + release.data.html_url)
            } catch (e) {
              // We are good to create the release if release with same tag doesn't exists
              if (e.status != 404) {
                throw e
              }
              console.log('No existing release found with this tag. Proceeding with release.')
              shouldRelease = true;
            }

            // Existing versions are quiet on the weekly schedule. Explicit
            // runs and image changes still build fresh Linux packages for the image.
            const runtimes = shouldRelease
              ? ['linux-arm', 'linux-arm64', 'linux-x64', 'osx-arm64', 'osx-x64']
              : ['linux-arm64', 'linux-x64'];
            core.setOutput('build_matrix', JSON.stringify({
              include: runtimes.map(runtime => ({
                devScript: './dev.sh',
                os: runtime.startsWith('osx-') ? 'macOS-latest' : 'ubuntu-latest',
                runtime
              }))
            }));
            core.setOutput('should_build', String(shouldRelease || context.eventName !== 'schedule'));
            core.setOutput('should_release', String(shouldRelease));

  build:
    needs: [check, merge-upstream]
    if: needs.check.outputs.should_build == 'true'
    outputs:
      linux-x64-artifact-id: ${{ steps.artifact.outputs.linux-x64-artifact-id }}
      linux-x64-sha: ${{ steps.sha.outputs.linux-x64-sha256 }}
      linux-arm64-artifact-id: ${{ steps.artifact.outputs.linux-arm64-artifact-id }}
      linux-arm64-sha: ${{ steps.sha.outputs.linux-arm64-sha256 }}
      linux-arm-artifact-id: ${{ steps.artifact.outputs.linux-arm-artifact-id }}
      linux-arm-sha: ${{ steps.sha.outputs.linux-arm-sha256 }}
      osx-x64-artifact-id: ${{ steps.artifact.outputs.osx-x64-artifact-id }}
      osx-x64-sha: ${{ steps.sha.outputs.osx-x64-sha256 }}
      osx-arm64-artifact-id: ${{ steps.artifact.outputs.osx-arm64-artifact-id }}
      osx-arm64-sha: ${{ steps.sha.outputs.osx-arm64-sha256 }}
    strategy:
      matrix: ${{ fromJSON(needs.check.outputs.build_matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.merge-upstream.outputs.source_sha }}

      - name: Update `runnerversion` file
        run: |
          echo "Updating runnerversion file to ${{ needs.check.outputs.version }}"
          echo "${{ needs.check.outputs.version }}" > src/runnerversion

      # Build runner layout
      - name: Build & Layout Release
        run: |
          ${{ matrix.devScript }} layout Release ${{ matrix.runtime }}
        working-directory: src

      # Create runner package tar.gz/zip
      - name: Package Release
        if: github.event_name != 'pull_request'
        run: |
          ${{ matrix.devScript }} package Release ${{ matrix.runtime }}
        working-directory: src

      # compute shas and set as job outputs to use in release notes
      - run: brew install coreutils #needed for shasum util
        if: ${{ matrix.os == 'macOS-latest' }}
        name: Install Dependencies for SHA Calculation (osx)
      - run: |
          file=$(ls)
          sha=$(sha256sum "$file" | awk '{ print $1 }')
          echo "Computed sha256: $sha for $file"
          echo "${{matrix.runtime}}-sha256=$sha" >> "$GITHUB_OUTPUT"
        shell: bash
        id: sha
        name: Compute SHA256
        working-directory: _package

      # Upload runner package tar.gz/zip as artifact.
      - name: Publish Artifact
        id: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: runner-packages-${{ matrix.runtime }}
          path: |
            _package

      - name: Record this build's artifact ID
        id: artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          test -n "$ARTIFACT_ID"
          echo "${{ matrix.runtime }}-artifact-id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

  release:
    if: needs.check.outputs.should_release == 'true'
    needs: [build, check, merge-upstream]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.merge-upstream.outputs.source_sha }}

      # Download runner package tar.gz/zip produced by 'build' job
      - name: Download Artifact (osx-x64)
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.osx-x64-artifact-id }}
          merge-multiple: true
          path: ./
      - name: Download Artifact (osx-arm64)
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.osx-arm64-artifact-id }}
          merge-multiple: true
          path: ./
      - name: Download Artifact (linux-x64)
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.linux-x64-artifact-id }}
          merge-multiple: true
          path: ./
      - name: Download Artifact (linux-arm)
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.linux-arm-artifact-id }}
          merge-multiple: true
          path: ./
      - name: Download Artifact (linux-arm64)
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.linux-arm64-artifact-id }}
          merge-multiple: true
          path: ./

      - name: Validate Packages HASH
        run: |
          ls -l
          echo "${{needs.build.outputs.osx-x64-sha}}  actions-runner-osx-x64-${{ needs.check.outputs.version }}.tar.gz" | shasum -a 256 -c
          echo "${{needs.build.outputs.osx-arm64-sha}}  actions-runner-osx-arm64-${{ needs.check.outputs.version }}.tar.gz" | shasum -a 256 -c
          echo "${{needs.build.outputs.linux-x64-sha}}  actions-runner-linux-x64-${{ needs.check.outputs.version }}.tar.gz" | shasum -a 256 -c
          echo "${{needs.build.outputs.linux-arm-sha}}  actions-runner-linux-arm-${{ needs.check.outputs.version }}.tar.gz" | shasum -a 256 -c
          echo "${{needs.build.outputs.linux-arm64-sha}}  actions-runner-linux-arm64-${{ needs.check.outputs.version }}.tar.gz" | shasum -a 256 -c

      - name: Create ${{ needs.check.outputs.version }} Runner Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.merge-upstream.outputs.source_sha }}
        run: |
          # A non-forced push refuses an existing tag at any other commit.
          # --target alone would silently reuse a pre-existing, mismatched tag.
          git update-ref "refs/tags/$RELEASE_TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          release_options=()
          if [ "$PRERELEASE" = 'true' ]; then
            release_options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --notes "Source: $SOURCE_SHA. See [Release Notes](https://github.com/actions/runner/releases/tag/v${{ needs.check.outputs.version }})" \
            "${release_options[@]}" \
            actions-runner-*-${{ needs.check.outputs.version }}.*

  publish-image:
    # Image-only updates use fresh Linux packages from this same source commit,
    # without replacing the existing version's release assets or tag.
    needs: [build, check, merge-upstream, release]
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.check.result == 'success' &&
      needs.merge-upstream.result == 'success' &&
      (
        needs.release.result == 'success' ||
        (needs.check.outputs.should_release == 'false' && needs.release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ inputs.image_name || format('{0}/actions-runner', github.repository_owner) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.merge-upstream.outputs.source_sha }}

      - name: Download this run's Linux x64 package
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.linux-x64-artifact-id }}
          merge-multiple: true
          path: images/runner-packages

      - name: Download this run's Linux arm64 package
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.linux-arm64-artifact-id }}
          merge-multiple: true
          path: images/runner-packages

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./images
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.merge-upstream.outputs.source_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            RUNNER_PACKAGE_SHA256_ARM64=${{ needs.build.outputs.linux-arm64-sha }}
            RUNNER_PACKAGE_SHA256_X64=${{ needs.build.outputs.linux-x64-sha }}
            RUNNER_PACKAGE_SOURCE=local
            RUNNER_VERSION=${{ needs.check.outputs.version }}
            VERIFY_RUNNER_PACKAGE=true
          push: true
          labels: |
            org.opencontainers.image.source=${{github.server_url}}/${{github.repository}}
            org.opencontainers.image.description=Runner ${{ needs.check.outputs.version }} built from ${{github.server_url}}/${{github.repository}}/commit/${{ needs.merge-upstream.outputs.source_sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ needs.merge-upstream.outputs.source_sha }}

      - name: Generate workflow provenance
        id: workflow-provenance
        uses: actions/attest-build-provenance/predicate@v3

      - name: Record merged source in provenance
        id: source-provenance
        uses: actions/github-script@v9
        env:
          PREDICATE: ${{ steps.workflow-provenance.outputs.predicate }}
          SOURCE_SHA: ${{ needs.merge-upstream.outputs.source_sha }}
        with:
          script: |
            const predicate = JSON.parse(process.env.PREDICATE);
            // Keep the triggering workflow revision as a dependency; it is
            // different from the source checked out after the upstream merge.
            predicate.buildDefinition.resolvedDependencies.push({
              digest: { gitCommit: process.env.SOURCE_SHA },
              name: 'runner-source',
              uri: `git+${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}@${process.env.SOURCE_SHA}`
            });
            core.setOutput('predicate', JSON.stringify(predicate));

      - name: Generate attestation
        uses: actions/attest@v4.2.2
        with:
          create-storage-record: false
          predicate: ${{ steps.source-provenance.outputs.predicate }}
          predicate-type: ${{ steps.workflow-provenance.outputs.predicate-type }}
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
