name: Runner CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - releases/*
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
    - '**'
    paths-ignore:
    - '**.md'

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Test release source consistency without publishing
      run: ruby .github/scripts/test-release-source.rb

  build:
    strategy:
      matrix:
        runtime: [ linux-x64, linux-arm64, linux-arm, osx-x64, osx-arm64 ]
        include:
        - runtime: linux-x64
          os: ubuntu-latest
          devScript: ./dev.sh

        - runtime: linux-arm64
          os: ubuntu-latest
          devScript: ./dev.sh

        - runtime: linux-arm
          os: ubuntu-latest
          devScript: ./dev.sh

        - runtime: osx-x64
          os: macOS-latest
          devScript: ./dev.sh

        - runtime: osx-arm64
          os: macOS-latest
          devScript: ./dev.sh

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    # Build runner layout
    - name: Build & Layout Release
      run: |
        ${{ matrix.devScript }} layout Release ${{ matrix.runtime }}
      working-directory: src

    # Run tests
    - name: L0
      run: |
        ${{ matrix.devScript }} test
      working-directory: src
      if: matrix.runtime != 'linux-arm64' && matrix.runtime != 'linux-arm' && matrix.runtime != 'osx-arm64'

    # Create runner package tar.gz/zip
    - name: Package Release
      if: github.event_name != 'pull_request' || matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-arm64'
      run: |
        ${{ matrix.devScript }} package Release ${{ matrix.runtime }}
      working-directory: src

    # Upload runner package tar.gz/zip as artifact
    - name: Publish Artifact
      if: github.event_name != 'pull_request' || matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-arm64'
      uses: actions/upload-artifact@v7
      with:
        name: runner-package-${{ matrix.runtime }}
        path: |
          _package

  docker:
    needs: build
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        include:
          - os: ubuntu-latest
            docker_platform: linux/amd64
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            docker_platform: linux/arm64
            runtime: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Download the package built by this run
      uses: actions/download-artifact@v5
      with:
        name: runner-package-${{ matrix.runtime }}
        path: images/runner-packages

    - name: Read package version and checksum
      id: package
      run: |
        version=$(cat src/runnerversion)
        package="images/runner-packages/actions-runner-${{ matrix.runtime }}-${version}.tar.gz"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "sha256=$(sha256sum "$package" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./images
        load: true
        platforms: ${{ matrix.docker_platform }}
        tags: |
          ${{ github.sha }}:latest
        build-args: |
          RUNNER_PACKAGE_SHA256_ARM64=${{ steps.package.outputs.sha256 }}
          RUNNER_PACKAGE_SHA256_X64=${{ steps.package.outputs.sha256 }}
          RUNNER_PACKAGE_SOURCE=local
          RUNNER_VERSION=${{ steps.package.outputs.version }}
          VERIFY_RUNNER_PACKAGE=true

    - name: Test Docker image
      run: |
        version=$(docker run --rm -e ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT=0 ${{ github.sha }}:latest ./run.sh --version)
        test "$version" = "${{ steps.package.outputs.version }}"
  
